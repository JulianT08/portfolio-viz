# Render Blueprint - One-click deployment
# https://render.com/docs/blueprint-spec

services:
  # Web Service (Backend + Frontend)
  - type: web
    name: portfolio-vault
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

databases:
  # PostgreSQL Database
  - name: portfolio-db
    plan: free
    region: oregon
    databaseName: portfolio
    user: portfolio_user
