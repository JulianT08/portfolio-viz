<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PortfolioVault - Track your investment portfolio with real-time stock prices">
  <meta name="theme-color" content="#0a0a0f">
  <title>PortfolioVault - Investment Portfolio Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a24;--text:#fff;--text2:#a0a0b0;--muted:#6b7280;--green:#00d4aa;--green-dim:rgba(0,212,170,.15);--red:#ff4757;--red-dim:rgba(255,71,87,.15);--blue:#4f8cff;--purple:#8b5cf6;--border:rgba(255,255,255,.08);--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
    .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;color:var(--text2)}
    .spin{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    
    /* Auth */
    .auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 20% 20%,rgba(0,212,170,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(79,140,255,.08) 0%,transparent 50%),var(--bg)}
    .auth-box{width:100%;max-width:420px;background:linear-gradient(135deg,#151520,#1a1a28);border:1px solid var(--border);border-radius:var(--r-xl);padding:48px 40px}
    .auth-head{text-align:center;margin-bottom:40px}
    .logo{width:72px;height:72px;background:linear-gradient(135deg,var(--green),var(--blue));border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:#fff}
    .auth-head h1{font-size:28px;margin-bottom:8px}
    .auth-head p{color:var(--text2);font-size:15px}
    .form{display:flex;flex-direction:column;gap:20px}
    .field{display:flex;flex-direction:column;gap:8px}
    .field label{font-size:13px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
    .field input,.field select{width:100%;padding:14px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:15px;font-family:inherit}
    .field input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
    .error{background:var(--red-dim);color:var(--red);padding:12px 16px;border-radius:var(--r-md);font-size:14px;text-align:center}
    .btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--green),#00b894);border:none;border-radius:var(--r-md);color:#0a0a0f;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
    .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,212,170,.3)}
    .btn:disabled{opacity:.7;cursor:not-allowed;transform:none}
    .btn.sell{background:linear-gradient(135deg,var(--red),#e84118)}
    .toggle{text-align:center;margin-top:24px;color:var(--text2);font-size:14px}
    .toggle button{background:none;border:none;color:var(--green);font-weight:600;cursor:pointer;font-family:inherit}
    
    /* Dashboard */
    .dash{min-height:100vh}
    .header{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:16px;position:sticky;top:0;z-index:100}
    .header-left{display:flex;align-items:center;gap:16px}
    .header-left .logo{width:40px;height:40px;border-radius:var(--r-sm);margin:0}
    .header-left h1{font-size:20px}
    .header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .status{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg3);border-radius:var(--r-sm);font-size:12px;color:var(--text2)}
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
    .status-dot.live{background:var(--green)}
    .status-dot.loading{background:#ffc107;animation:pulse 1s infinite}
    .status-dot.error{background:var(--red)}
    .user{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
    .user-name{font-weight:600;font-size:14px}
    .user-time{font-size:12px;color:var(--muted)}
    .logout{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text2);font-size:14px;cursor:pointer;font-family:inherit}
    .logout:hover{background:var(--red-dim);color:var(--red);border-color:var(--red)}
    
    .main{padding:32px;max-width:1400px;margin:0 auto}
    
    /* Value Card */
    .value-card{background:linear-gradient(135deg,#151520,#1a1a28);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px;margin-bottom:24px}
    .value-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:16px}
    .value-label{font-size:14px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
    .value-amt{font-size:48px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-bottom:8px}
    .value-chg{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500}
    .value-chg.pos{color:var(--green)}
    .value-chg.neg{color:var(--red)}
    .chart{margin-top:32px;height:300px}
    .chart-empty{height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:var(--r-md);color:var(--muted)}
    
    .time-btns{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:var(--r-sm)}
    .time-btns button{padding:6px 12px;background:transparent;border:none;border-radius:6px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
    .time-btns button.active{background:var(--green);color:#0a0a0f}
    
    /* Stats */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
    .stat{background:linear-gradient(135deg,#151520,#1a1a28);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden}
    .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
    .stat.pos::before{background:var(--green)}
    .stat.neg::before{background:var(--red)}
    .stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
    .stat-val{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace}
    .stat.pos .stat-val{color:var(--green)}
    .stat.neg .stat-val{color:var(--red)}
    
    /* Cash & Alloc */
    .cash-row{display:grid;grid-template-columns:1fr 2fr;gap:24px;margin-bottom:32px}
    @media(max-width:900px){.cash-row{grid-template-columns:1fr}}
    .cash-card{background:linear-gradient(135deg,#151520,#1a1a28);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;display:flex;align-items:center;gap:20px;cursor:pointer}
    .cash-card:hover{border-color:var(--blue)}
    .cash-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
    .cash-info{flex:1}
    .cash-lbl{font-size:12px;color:var(--muted);text-transform:uppercase}
    .cash-amt{font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace}
    .cash-yld{font-size:13px;color:var(--green)}
    .alloc-card{background:linear-gradient(135deg,#151520,#1a1a28);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px}
    .alloc-card h3{font-size:14px;color:var(--text2);text-transform:uppercase;margin-bottom:16px}
    .alloc-bar{height:12px;background:var(--bg3);border-radius:6px;display:flex;overflow:hidden;margin-bottom:16px}
    .alloc-stocks{background:linear-gradient(90deg,var(--green),#00b894)}
    .alloc-cash{background:linear-gradient(90deg,var(--blue),var(--purple))}
    .alloc-legend{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--text2)}
    .alloc-legend span{display:flex;align-items:center;gap:8px}
    .dot{width:10px;height:10px;border-radius:50%}
    .dot.g{background:var(--green)}
    .dot.b{background:var(--blue)}
    
    /* Positions */
    .positions{background:linear-gradient(135deg,#151520,#1a1a28);border:1px solid var(--border);border-radius:var(--r-xl);padding:24px}
    .pos-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:16px}
    .pos-head h2{font-size:18px}
    .add-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg,var(--green),#00b894);border:none;border-radius:var(--r-sm);color:#0a0a0f;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
    .add-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,212,170,.3)}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:12px 16px;font-size:11px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border)}
    td{padding:16px;border-bottom:1px solid var(--border)}
    tr:hover{background:rgba(255,255,255,.02)}
    .ticker{font-weight:600}
    .ticker-name{font-size:12px;color:var(--muted)}
    .mono{font-family:'JetBrains Mono',monospace;font-size:14px}
    .pos{color:var(--green)}
    .neg{color:var(--red)}
    .act-btn{width:32px;height:32px;border:none;border-radius:var(--r-sm);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-left:8px}
    .act-btn.sell{background:var(--red-dim);color:var(--red)}
    .act-btn.sell:hover{background:var(--red);color:#fff}
    .act-btn.del{background:rgba(255,255,255,.05);color:var(--muted)}
    .act-btn.del:hover{background:var(--red-dim);color:var(--red)}
    .empty{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty h3{color:var(--text);margin:16px 0 8px}
    
    /* Modal */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;backdrop-filter:blur(4px)}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    .modal-head h2{font-size:20px}
    .close{width:36px;height:36px;border:none;background:var(--bg3);border-radius:var(--r-sm);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
    .close:hover{background:var(--red-dim);color:var(--red)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:500px){.row{grid-template-columns:1fr}}
    .cost-box{display:flex;justify-content:space-between;padding:16px;background:var(--bg3);border-radius:var(--r-md)}
    .cost-box span{color:var(--text2)}
    .cost-box strong{font-family:'JetBrains Mono',monospace;font-size:18px}
    .check-box{padding:16px;background:var(--bg3);border-radius:var(--r-md)}
    .check-box label{display:flex;align-items:center;gap:12px;cursor:pointer}
    .check-box input{width:18px;height:18px;accent-color:var(--green)}
    .pos-info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
    .info-item{padding:16px;background:var(--bg3);border-radius:var(--r-md);text-align:center}
    .info-item span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
    .info-item strong{font-family:'JetBrains Mono',monospace}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .summary-item{padding:16px;background:var(--bg3);border-radius:var(--r-md);text-align:center}
    .summary-item span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
    .summary-item strong{font-family:'JetBrains Mono',monospace;font-size:18px}
    .action-btns{display:flex;gap:8px;margin-bottom:16px}
    .action-btns button{flex:1;padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text2);cursor:pointer;font-family:inherit}
    .action-btns button.active{background:var(--blue);border-color:var(--blue);color:#fff}
    .cur-val{padding:16px;background:var(--bg3);border-radius:var(--r-md);text-align:center;margin-bottom:16px;color:var(--text2)}
    .cur-val strong{font-family:'JetBrains Mono',monospace;color:var(--text)}
    
    .tooltip{background:var(--bg2)!important;border:1px solid var(--border)!important;border-radius:var(--r-sm)!important;padding:12px 16px!important}
    .tooltip-date{font-size:12px;color:var(--muted)}
    .tooltip-val{font-size:16px;font-weight:600;font-family:'JetBrains Mono',monospace}
    
    .db-info{margin-top:24px;padding:16px;background:var(--green-dim);border-radius:var(--r-md);color:var(--green);font-size:13px;text-align:center}
    
    @media(max-width:768px){
      .value-amt{font-size:32px}
      .main{padding:16px}
      .header{padding:12px 16px}
    }
  </style>
</head>
<body>
  <div id="root"><div class="loading"><svg class="spin" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00d4aa" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><p>Loading PortfolioVault...</p></div></div>
  
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;
    const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;
    
    // API URL - empty means same origin (works on Render)
    const API = '';
    
    // Stock names
    const NAMES = {AAPL:'Apple Inc.',GOOGL:'Alphabet Inc.',MSFT:'Microsoft Corp.',AMZN:'Amazon.com',TSLA:'Tesla Inc.',NVDA:'NVIDIA Corp.',META:'Meta Platforms',JPM:'JPMorgan Chase',V:'Visa Inc.',SPY:'S&P 500 ETF',QQQ:'Nasdaq 100 ETF',VOO:'Vanguard S&P 500',VTI:'Vanguard Total Market',BRK:'Berkshire Hathaway',JNJ:'Johnson & Johnson',WMT:'Walmart Inc.',PG:'Procter & Gamble',MA:'Mastercard',UNH:'UnitedHealth',HD:'Home Depot',DIS:'Walt Disney',NFLX:'Netflix',ADBE:'Adobe',CRM:'Salesforce',AMD:'AMD Inc.',INTC:'Intel Corp.'};
    
    // Fetch stock price from Finnhub
    const getPrice = async (sym) => {
      try {
        const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=demo`);
        const d = await r.json();
        if (d.c > 0) return { price: d.c, change: d.d || 0, pct: d.dp || 0, name: NAMES[sym] || sym };
      } catch(e) {}
      // Fallback
      const seed = sym.split('').reduce((a,c) => a + c.charCodeAt(0), 0);
      return { price: 50 + (seed % 400), change: ((seed % 10) - 5) * 0.5, pct: 0, name: NAMES[sym] || sym, fallback: true };
    };
    
    // Auth Screen
    const Auth = ({ onLogin }) => {
      const [mode, setMode] = useState('login');
      const [user, setUser] = useState('');
      const [pass, setPass] = useState('');
      const [err, setErr] = useState('');
      const [loading, setLoading] = useState(false);
      
      const submit = async (e) => {
        e.preventDefault();
        setErr('');
        setLoading(true);
        try {
          const r = await fetch(`${API}/api/auth/${mode === 'login' ? 'login' : 'register'}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username: user, password: pass })
          });
          const d = await r.json();
          if (d.error) setErr(d.error);
          else onLogin(d.user);
        } catch(e) {
          setErr('Connection error');
        }
        setLoading(false);
      };
      
      return (
        <div className="auth">
          <div className="auth-box">
            <div className="auth-head">
              <div className="logo"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></div>
              <h1>PortfolioVault</h1>
              <p>Track your investments with precision</p>
            </div>
            <form onSubmit={submit} className="form">
              <div className="field">
                <label>Username</label>
                <input value={user} onChange={e => setUser(e.target.value.toLowerCase().replace(/[^a-z0-9]/g,''))} placeholder="Enter username" required />
              </div>
              <div className="field">
                <label>Password</label>
                <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Enter password" required />
              </div>
              {err && <div className="error">{err}</div>}
              <button type="submit" className="btn" disabled={loading}>{loading ? 'Please wait...' : (mode === 'login' ? 'Sign In' : 'Create Account')}</button>
            </form>
            <div className="toggle">
              {mode === 'login' ? "Don't have an account? " : "Already have an account? "}
              <button onClick={() => { setMode(mode === 'login' ? 'register' : 'login'); setErr(''); }}>{mode === 'login' ? 'Sign Up' : 'Sign In'}</button>
            </div>
          </div>
        </div>
      );
    };
    
    // Modal
    const Modal = ({ open, onClose, title, children }) => {
      if (!open) return null;
      return (
        <div className="modal-bg" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-head">
              <h2>{title}</h2>
              <button className="close" onClick={onClose}>×</button>
            </div>
            {children}
          </div>
        </div>
      );
    };
    
    // Add Modal
    const AddModal = ({ open, onClose, onAdd, cash }) => {
      const [ticker, setTicker] = useState('');
      const [shares, setShares] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [cost, setCost] = useState('');
      const [isBuy, setIsBuy] = useState(false);
      const [price, setPrice] = useState(null);
      
      useEffect(() => {
        if (ticker.length >= 1) {
          const t = setTimeout(async () => setPrice(await getPrice(ticker.toUpperCase())), 500);
          return () => clearTimeout(t);
        }
        setPrice(null);
      }, [ticker]);
      
      const basis = shares && cost ? (parseFloat(cost) / parseFloat(shares)).toFixed(2) : '0.00';
      const insufficient = isBuy && parseFloat(cost) > cash;
      
      const submit = e => {
        e.preventDefault();
        if (insufficient) return;
        onAdd({ ticker: ticker.toUpperCase(), shares: parseFloat(shares), costBasis: parseFloat(basis), totalCost: parseFloat(cost), purchaseDate: date, name: price?.name || ticker.toUpperCase(), isBuy });
        setTicker(''); setShares(''); setCost(''); setPrice(null);
        onClose();
      };
      
      return (
        <Modal open={open} onClose={onClose} title="Add Investment">
          <form onSubmit={submit} className="form">
            <div className="row">
              <div className="field">
                <label>Ticker</label>
                <input value={ticker} onChange={e => setTicker(e.target.value.toUpperCase())} placeholder="AAPL" required />
                {price && <small style={{color:'var(--green)',marginTop:4,display:'block'}}>{price.name} - ${price.price?.toFixed(2)}</small>}
              </div>
              <div className="field">
                <label>Shares</label>
                <input type="number" step="0.0001" min="0.0001" value={shares} onChange={e => setShares(e.target.value)} placeholder="0" required />
              </div>
            </div>
            <div className="row">
              <div className="field">
                <label>Date</label>
                <input type="date" value={date} onChange={e => setDate(e.target.value)} max={new Date().toISOString().split('T')[0]} required />
              </div>
              <div className="field">
                <label>Total Cost ($)</label>
                <input type="number" step="0.01" min="0.01" value={cost} onChange={e => setCost(e.target.value)} placeholder="0.00" required />
              </div>
            </div>
            <div className="cost-box"><span>Avg Cost Basis:</span><strong>${basis}</strong></div>
            <div className="check-box">
              <label><input type="checkbox" checked={isBuy} onChange={e => setIsBuy(e.target.checked)} /> Deduct from cash (Buy)</label>
              {isBuy && <div style={{marginTop:8,fontSize:13,color:insufficient?'var(--red)':'var(--muted)'}}>Available: ${cash.toLocaleString('en-US',{minimumFractionDigits:2})}{insufficient && ' - Insufficient'}</div>}
            </div>
            <button type="submit" className="btn" disabled={insufficient}>+ Add Investment</button>
          </form>
        </Modal>
      );
    };
    
    // Sell Modal
    const SellModal = ({ open, onClose, onSell, pos, curPrice }) => {
      const [shares, setShares] = useState('');
      const [price, setPrice] = useState(curPrice?.toString() || '');
      
      useEffect(() => { if (curPrice) setPrice(curPrice.toString()); }, [curPrice]);
      
      if (!pos) return null;
      
      const proceeds = shares && price ? (parseFloat(shares) * parseFloat(price)).toFixed(2) : '0.00';
      const gain = shares && price ? (parseFloat(shares) * (parseFloat(price) - parseFloat(pos.cost_basis))).toFixed(2) : '0.00';
      const tooMany = parseFloat(shares) > parseFloat(pos.shares);
      
      const submit = e => {
        e.preventDefault();
        if (tooMany) return;
        onSell({ ticker: pos.ticker, shares: parseFloat(shares), salePrice: parseFloat(price), totalProceeds: parseFloat(proceeds) });
        setShares('');
        onClose();
      };
      
      return (
        <Modal open={open} onClose={onClose} title={`Sell ${pos.ticker}`}>
          <form onSubmit={submit} className="form">
            <div className="pos-info">
              <div className="info-item"><span>Holdings</span><strong>{parseFloat(pos.shares).toLocaleString()}</strong></div>
              <div className="info-item"><span>Cost Basis</span><strong>${parseFloat(pos.cost_basis).toFixed(2)}</strong></div>
              <div className="info-item"><span>Current</span><strong>${curPrice?.toFixed(2) || '—'}</strong></div>
            </div>
            <div className="row">
              <div className="field">
                <label>Shares</label>
                <input type="number" step="0.0001" min="0.0001" value={shares} onChange={e => setShares(e.target.value)} placeholder="0" required />
              </div>
              <div className="field">
                <label>Price ($)</label>
                <input type="number" step="0.01" min="0.01" value={price} onChange={e => setPrice(e.target.value)} placeholder="0.00" required />
              </div>
            </div>
            {tooMany && <div className="error">Cannot sell more than you own</div>}
            <div className="summary">
              <div className="summary-item"><span>Proceeds</span><strong>${parseFloat(proceeds).toLocaleString('en-US',{minimumFractionDigits:2})}</strong></div>
              <div className={`summary-item ${parseFloat(gain) >= 0 ? 'pos' : 'neg'}`}><span>Gain/Loss</span><strong>{parseFloat(gain) >= 0 ? '+' : ''}${parseFloat(gain).toLocaleString('en-US',{minimumFractionDigits:2})}</strong></div>
            </div>
            <button type="submit" className="btn sell" disabled={tooMany || !shares}>Sell</button>
          </form>
        </Modal>
      );
    };
    
    // Cash Modal
    const CashModal = ({ open, onClose, onUpdate, curCash, curYield }) => {
      const [cash, setCash] = useState(curCash?.toString() || '');
      const [yld, setYld] = useState(curYield?.toString() || '');
      const [action, setAction] = useState('set');
      
      useEffect(() => { setCash(curCash?.toString() || ''); setYld(curYield?.toString() || ''); }, [curCash, curYield, open]);
      
      const submit = e => {
        e.preventDefault();
        let amt = parseFloat(cash) || 0;
        if (action === 'add') amt = curCash + amt;
        else if (action === 'sub') amt = curCash - amt;
        onUpdate({ amount: Math.max(0, amt), yieldRate: parseFloat(yld) || 0 });
        onClose();
      };
      
      return (
        <Modal open={open} onClose={onClose} title="Manage Cash">
          <form onSubmit={submit} className="form">
            <div className="action-btns">
              <button type="button" className={action === 'set' ? 'active' : ''} onClick={() => setAction('set')}>Set</button>
              <button type="button" className={action === 'add' ? 'active' : ''} onClick={() => setAction('add')}>Deposit</button>
              <button type="button" className={action === 'sub' ? 'active' : ''} onClick={() => setAction('sub')}>Withdraw</button>
            </div>
            <div className="cur-val">Current: <strong>${curCash.toLocaleString('en-US',{minimumFractionDigits:2})}</strong></div>
            <div className="row">
              <div className="field">
                <label>Amount</label>
                <input type="number" step="0.01" min="0" value={cash} onChange={e => setCash(e.target.value)} placeholder="0.00" required />
              </div>
              <div className="field">
                <label>Yield (%)</label>
                <input type="number" step="0.01" min="0" max="100" value={yld} onChange={e => setYld(e.target.value)} placeholder="0.00" />
              </div>
            </div>
            <button type="submit" className="btn">Update Cash</button>
          </form>
        </Modal>
      );
    };
    
    // Tooltip
    const ChartTooltip = ({ active, payload, label }) => {
      if (active && payload?.length) {
        return <div className="tooltip"><p className="tooltip-date">{label}</p><p className="tooltip-val">${payload[0].value.toLocaleString('en-US',{minimumFractionDigits:2})}</p></div>;
      }
      return null;
    };
    
    // Dashboard
    const Dashboard = ({ user, onLogout }) => {
      const [positions, setPositions] = useState([]);
      const [cash, setCash] = useState(0);
      const [yld, setYld] = useState(0);
      const [history, setHistory] = useState([]);
      const [prices, setPrices] = useState({});
      const [range, setRange] = useState('1Y');
      const [showAdd, setShowAdd] = useState(false);
      const [showSell, setShowSell] = useState(false);
      const [showCash, setShowCash] = useState(false);
      const [sellPos, setSellPos] = useState(null);
      const [updated, setUpdated] = useState(new Date());
      const [status, setStatus] = useState('loading');
      
      // Load data
      useEffect(() => {
        const load = async () => {
          try {
            const [p, c, h] = await Promise.all([
              fetch(`${API}/api/positions`, { credentials: 'include' }).then(r => r.json()),
              fetch(`${API}/api/cash`, { credentials: 'include' }).then(r => r.json()),
              fetch(`${API}/api/history`, { credentials: 'include' }).then(r => r.json())
            ]);
            setPositions(p);
            setCash(parseFloat(c.amount) || 0);
            setYld(parseFloat(c.yield_rate) || 0);
            setHistory(h);
          } catch(e) { console.error(e); }
        };
        load();
      }, []);
      
      // Fetch prices
      const fetchPrices = useCallback(async () => {
        if (!positions.length) return;
        setStatus('loading');
        try {
          const pr = {};
          for (const p of positions) pr[p.ticker] = await getPrice(p.ticker);
          setPrices(pr);
          setUpdated(new Date());
          setStatus('live');
        } catch(e) { setStatus('error'); }
      }, [positions]);
      
      useEffect(() => {
        if (positions.length) {
          fetchPrices();
          const i = setInterval(fetchPrices, 15000);
          return () => clearInterval(i);
        }
      }, [positions.length, fetchPrices]);
      
      // Save history
      useEffect(() => {
        if (positions.length && Object.keys(prices).length) {
          const sv = positions.reduce((s, p) => s + parseFloat(p.shares) * (prices[p.ticker]?.price || parseFloat(p.cost_basis)), 0);
          fetch(`${API}/api/history`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ totalValue: sv + cash }) });
        }
      }, [positions, prices, cash]);
      
      // Metrics
      const metrics = useMemo(() => {
        const sv = positions.reduce((s, p) => s + parseFloat(p.shares) * (prices[p.ticker]?.price || parseFloat(p.cost_basis)), 0);
        const tc = positions.reduce((s, p) => s + parseFloat(p.total_cost), 0);
        const tv = sv + cash;
        const dc = positions.reduce((s, p) => s + parseFloat(p.shares) * (prices[p.ticker]?.change || 0), 0);
        return { tv, sv, tc, dc, dp: tv > 0 ? (dc / tv) * 100 : 0 };
      }, [positions, prices, cash]);
      
      // Chart
      const chartData = useMemo(() => {
        if (!history.length) return [];
        const now = new Date();
        let days = 365;
        if (range === '1W') days = 7;
        else if (range === '1M') days = 30;
        else if (range === '3M') days = 90;
        else if (range === 'YTD') days = Math.floor((now - new Date(now.getFullYear(), 0, 1)) / 86400000);
        else if (range === 'ALL') days = 10000;
        const cut = new Date(); cut.setDate(cut.getDate() - days);
        return history.filter(h => new Date(h.date) >= cut).map(h => ({ date: h.date, value: parseFloat(h.value) }));
      }, [history, range]);
      
      // Handlers
      const handleAdd = async (inv) => {
        const r = await fetch(`${API}/api/positions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(inv) });
        setPositions(await r.json());
        if (inv.isBuy) setCash(c => Math.max(0, c - inv.totalCost));
        if (!prices[inv.ticker]) getPrice(inv.ticker).then(p => setPrices(pr => ({ ...pr, [inv.ticker]: p })));
      };
      
      const handleSell = async (sale) => {
        const r = await fetch(`${API}/api/positions/sell`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(sale) });
        setPositions(await r.json());
        setCash(c => c + sale.totalProceeds);
        setShowSell(false); setSellPos(null);
      };
      
      const handleDel = async (ticker) => {
        if (!confirm(`Remove ${ticker}?`)) return;
        const r = await fetch(`${API}/api/positions/${ticker}`, { method: 'DELETE', credentials: 'include' });
        setPositions(await r.json());
      };
      
      const handleCash = async ({ amount, yieldRate }) => {
        await fetch(`${API}/api/cash`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ amount, yieldRate }) });
        setCash(amount); setYld(yieldRate);
      };
      
      const logout = async () => {
        await fetch(`${API}/api/auth/logout`, { method: 'POST', credentials: 'include' });
        onLogout();
      };
      
      return (
        <div className="dash">
          <header className="header">
            <div className="header-left">
              <div className="logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></div>
              <h1>PortfolioVault</h1>
            </div>
            <div className="header-right">
              <div className="status"><span className={`status-dot ${status}`}></span>{status === 'live' ? 'Live' : status === 'loading' ? 'Updating...' : 'Offline'}</div>
              <div className="user"><span className="user-name">{user.username}</span><span className="user-time">{updated.toLocaleTimeString()}</span></div>
              <button className="logout" onClick={logout}>Sign Out</button>
            </div>
          </header>
          
          <main className="main">
            <div className="value-card">
              <div className="value-head">
                <span className="value-label">Portfolio Value</span>
                <div className="time-btns">
                  {['1W','1M','3M','YTD','1Y','ALL'].map(r => <button key={r} className={range === r ? 'active' : ''} onClick={() => setRange(r)}>{r}</button>)}
                </div>
              </div>
              <div className="value-amt">${metrics.tv.toLocaleString('en-US',{minimumFractionDigits:2})}</div>
              <div className={`value-chg ${metrics.dc >= 0 ? 'pos' : 'neg'}`}>{metrics.dc >= 0 ? '▲' : '▼'} ${Math.abs(metrics.dc).toFixed(2)} ({metrics.dc >= 0 ? '+' : ''}{metrics.dp.toFixed(2)}%) today</div>
              <div className="chart">
                {chartData.length > 1 ? (
                  <ResponsiveContainer width="100%" height={300}>
                    <AreaChart data={chartData}>
                      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#00d4aa" stopOpacity={.3}/><stop offset="95%" stopColor="#00d4aa" stopOpacity={0}/></linearGradient></defs>
                      <XAxis dataKey="date" axisLine={false} tickLine={false} tick={{fill:'#6b7280',fontSize:11}} tickFormatter={v => new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric'})} />
                      <YAxis axisLine={false} tickLine={false} tick={{fill:'#6b7280',fontSize:11}} tickFormatter={v => `$${v >= 1000 ? (v/1000).toFixed(0)+'k' : v}`} domain={['auto','auto']} />
                      <Tooltip content={<ChartTooltip />} />
                      <Area type="monotone" dataKey="value" stroke="#00d4aa" strokeWidth={2} fill="url(#g)" />
                    </AreaChart>
                  </ResponsiveContainer>
                ) : <div className="chart-empty">Add investments to see performance</div>}
              </div>
            </div>
            
            <div className="stats">
              <div className={`stat ${metrics.dc >= 0 ? 'pos' : 'neg'}`}><div className="stat-label">Day P/L</div><div className="stat-val">{metrics.dc >= 0 ? '+' : '-'}${Math.abs(metrics.dc).toFixed(2)}</div></div>
              <div className={`stat ${metrics.dc >= 0 ? 'pos' : 'neg'}`}><div className="stat-label">Day %</div><div className="stat-val">{metrics.dc >= 0 ? '+' : ''}{metrics.dp.toFixed(2)}%</div></div>
              <div className={`stat ${metrics.sv - metrics.tc >= 0 ? 'pos' : 'neg'}`}><div className="stat-label">Total Gain</div><div className="stat-val">{metrics.sv - metrics.tc >= 0 ? '+' : '-'}${Math.abs(metrics.sv - metrics.tc).toFixed(2)}</div></div>
              <div className={`stat ${metrics.sv - metrics.tc >= 0 ? 'pos' : 'neg'}`}><div className="stat-label">Total %</div><div className="stat-val">{metrics.tc > 0 ? ((metrics.sv - metrics.tc) / metrics.tc * 100).toFixed(2) : 0}%</div></div>
            </div>
            
            <div className="cash-row">
              <div className="cash-card" onClick={() => setShowCash(true)}>
                <div className="cash-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg></div>
                <div className="cash-info">
                  <div className="cash-lbl">Cash Balance</div>
                  <div className="cash-amt">${cash.toLocaleString('en-US',{minimumFractionDigits:2})}</div>
                  <div className="cash-yld">{yld > 0 ? `${yld}% APY` : 'Click to set yield'}</div>
                </div>
              </div>
              <div className="alloc-card">
                <h3>Allocation</h3>
                <div className="alloc-bar">
                  <div className="alloc-stocks" style={{width:`${metrics.tv > 0 ? (metrics.sv / metrics.tv * 100) : 0}%`}} />
                  <div className="alloc-cash" style={{width:`${metrics.tv > 0 ? (cash / metrics.tv * 100) : 0}%`}} />
                </div>
                <div className="alloc-legend">
                  <span><span className="dot g"></span>Stocks: ${metrics.sv.toLocaleString('en-US',{minimumFractionDigits:2})} ({metrics.tv > 0 ? (metrics.sv / metrics.tv * 100).toFixed(1) : 0}%)</span>
                  <span><span className="dot b"></span>Cash: ${cash.toLocaleString('en-US',{minimumFractionDigits:2})} ({metrics.tv > 0 ? (cash / metrics.tv * 100).toFixed(1) : 0}%)</span>
                </div>
              </div>
            </div>
            
            <div className="positions">
              <div className="pos-head">
                <h2>Positions ({positions.length})</h2>
                <button className="add-btn" onClick={() => setShowAdd(true)}>+ Add Investment</button>
              </div>
              {positions.length ? (
                <div style={{overflowX:'auto'}}>
                  <table>
                    <thead><tr><th>Symbol</th><th>Shares</th><th>Cost</th><th>Price</th><th>Value</th><th>Day</th><th>Gain</th><th></th></tr></thead>
                    <tbody>
                      {positions.map(p => {
                        const pr = prices[p.ticker]?.price || parseFloat(p.cost_basis);
                        const v = parseFloat(p.shares) * pr;
                        const g = v - parseFloat(p.total_cost);
                        const dc = parseFloat(p.shares) * (prices[p.ticker]?.change || 0);
                        return (
                          <tr key={p.ticker}>
                            <td><div className="ticker">{p.ticker}</div><div className="ticker-name">{prices[p.ticker]?.name || p.name}</div></td>
                            <td className="mono">{parseFloat(p.shares).toLocaleString()}</td>
                            <td className="mono">${parseFloat(p.cost_basis).toFixed(2)}</td>
                            <td className="mono">${pr.toFixed(2)}</td>
                            <td className="mono">${v.toLocaleString('en-US',{minimumFractionDigits:2})}</td>
                            <td className={`mono ${dc >= 0 ? 'pos' : 'neg'}`}>{dc >= 0 ? '+' : ''}${dc.toFixed(2)}</td>
                            <td className={`mono ${g >= 0 ? 'pos' : 'neg'}`}>{g >= 0 ? '+' : ''}${g.toFixed(2)}<br/><small>({(g / parseFloat(p.total_cost) * 100).toFixed(2)}%)</small></td>
                            <td>
                              <button className="act-btn sell" onClick={() => { setSellPos(p); setShowSell(true); }}>↓</button>
                              <button className="act-btn del" onClick={() => handleDel(p.ticker)}>×</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              ) : (
                <div className="empty">
                  <div style={{fontSize:48,opacity:.5}}>📊</div>
                  <h3>No investments yet</h3>
                  <p>Add your first investment to start tracking</p>
                  <button className="add-btn" onClick={() => setShowAdd(true)}>+ Add Investment</button>
                </div>
              )}
            </div>
            
            <div className="db-info">✓ Your data is stored securely in the database and synced across all your devices</div>
          </main>
          
          <AddModal open={showAdd} onClose={() => setShowAdd(false)} onAdd={handleAdd} cash={cash} />
          <SellModal open={showSell} onClose={() => { setShowSell(false); setSellPos(null); }} onSell={handleSell} pos={sellPos} curPrice={sellPos ? prices[sellPos.ticker]?.price : null} />
          <CashModal open={showCash} onClose={() => setShowCash(false)} onUpdate={handleCash} curCash={cash} curYield={yld} />
        </div>
      );
    };
    
    // App
    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      
      useEffect(() => {
        fetch(`${API}/api/auth/me`, { credentials: 'include' })
          .then(r => r.json())
          .then(d => { if (d.authenticated) setUser(d.user); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);
      
      if (loading) return <div className="loading"><svg className="spin" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00d4aa" strokeWidth="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><p>Loading...</p></div>;
      
      return user ? <Dashboard user={user} onLogout={() => setUser(null)} /> : <Auth onLogin={setUser} />;
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
